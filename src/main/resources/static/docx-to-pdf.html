<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업실 — DOCX에서 PDF로 변환</title>
    <link rel="stylesheet" href="css/common.css?v=20261011-2">
    <link rel="stylesheet" href="css/editor.css?v=20261010-1">
    <link rel="stylesheet" href="css/converter.css?v=20261011-1">
    <script src="js/editor/workspace.js" defer></script>
    <script type="module" src="js/converter.js?v=20261011-1"></script>
</head>
<body class="dark">
<a class="skip-link" href="#document-workspace">파일 변환으로 이동</a>
<aside id="workspace-sidebar" aria-label="작업 공간">
    <a class="workspace-brand" href="index.html" title="Jakupsil 홈"><span class="brand-mark" aria-hidden="true">J</span><span class="sidebar-label">Jakupsil</span></a>
    <p class="sidebar-caption sidebar-label">작업 공간</p>
    <nav aria-label="문서 도구">
        <a href="index.html" title="도구 모음"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="sidebar-label">도구 모음</span></a>
        <a href="docx-editor.html" title="DOCX 문서"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v5h4M8 12h6M8 16h6"/></svg><span class="sidebar-label">DOCX 문서</span></a>
    <a href="docx-to-pdf.html" aria-current="page" title="DOCX에서 PDF로 변환"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15l-4-4M20 17H5l4 4M19 7l-4 4M5 17l4-4"/></svg><span class="sidebar-label">DOCX → PDF</span></a></nav>
    <p class="sidebar-footer sidebar-label">문서 작업을 위한 작은 공간</p>
</aside>
<header id="toolbar" aria-label="작업 공간 도구">
    <button type="button" id="sidebar-toggle" aria-controls="workspace-sidebar" aria-expanded="true" aria-label="사이드바 접기" title="사이드바 접기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    <a id="hub-link" href="index.html">도구 모음으로 돌아가기</a>
    <button class="theme-button" type="button" id="dark-mode" aria-label="다크 모드" title="다크 모드" aria-pressed="true">
        <svg width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13z"/>
        </svg>
    </button>
<button class="theme-button" type="button" id="white-mode" aria-label="라이트 모드" title="라이트 모드" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2
             M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42
             M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
        </svg>
    </button>
</header>
<main id="document-workspace" tabindex="-1">
    <p class="document-type">파일 변환 · DOCX → PDF</p>
    <h1>문서를 PDF로 변환하세요.</h1>
    <p class="converter-description">DOCX 파일을 선택하고 PDF로 저장하세요.</p>
    <form id="convert-form">
        <div class="upload-field">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>
            <label for="docx-file">변환할 DOCX 파일</label>
            <p id="file-help">.docx 파일 한 개를 선택해주세요.</p>
            <input id="docx-file" name="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" aria-describedby="file-help selected-file" required>
            <p id="selected-file" role="status">선택된 파일이 없습니다.</p>
        </div>
        <div class="conversion-actions">
            <button id="convert-button" type="submit" disabled aria-describedby="convert-status">PDF로 변환</button>
            <span>DOCX → PDF</span>
        </div>
    </form>
    <p id="convert-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <a id="converted-download" class="download-link" hidden download>PDF 파일 저장</a>
    <noscript><p>파일 변환을 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
</main>
</body>
</html>
