<button class="theme-button" type="button" id="white-mode" aria-label="라이트 모드" title="라이트 모드" aria-pressed="false">

<main id="document-workspace" tabindex="-1">
    <p class="document-type">PDF 도구 · 합치기</p>
    <h1>PDF 합치기</h1>
    <p class="converter-description">PDF 파일을 2개 이상 선택하세요. 각 파일의 모든 페이지를 목록 순서대로 합칩니다.</p>
    <form id="convert-form">
        <div class="upload-field">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>
            <label for="pdf-files">합칠 PDF 파일</label>
            <p id="file-help">PDF 파일을 여러 개 선택하거나 나중에 추가할 수 있습니다.</p>
            <input id="pdf-files" name="files" type="file" accept=".pdf,application/pdf" multiple aria-describedby="file-help selected-file">
            <p id="selected-file" role="status">선택된 PDF가 없습니다.</p>
        </div>
        <ol id="pdf-list" class="image-list" aria-label="PDF 파일 합치기 순서"></ol>
        <div class="conversion-title">
            <label for="pdf-title">PDF 제목 <span>(선택)</span></label>
            <input id="pdf-title" type="text" placeholder="제목을 입력하세요" aria-describedby="pdf-title-help" autocomplete="off">
            <p id="pdf-title-help">제목을 입력하면 해당 이름으로 PDF가 다운로드됩니다.</p>
        </div>
        <div class="conversion-actions">
            <button id="convert-button" type="submit" disabled aria-describedby="convert-status">PDF 합치기</button>
            <span id="file-count">0개 파일</span>
        </div>
    </form>
    <p id="convert-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>PDF 합치기를 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
</main>
</body>
</html>
