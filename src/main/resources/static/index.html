<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업실 — 웹 문서 에디터</title>
    <meta name="description"
          content="브라우저에서 문서를 작성하고 원하는 파일 형식으로 다운로드하세요.">

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="container">
    <header>
        <a class="logo" href="/">작업실</a>

        <a class="github"
           href="https://github.com/EEES0/docx-editor"
           target="_blank"
           rel="noopener noreferrer">
            GitHub ↗
        </a>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <p class="eyebrow">WORKING SPACE</p>

            <h1 id="hero-title">
                내가 쓰려고 만든<br>
                문서 작업실<br>
                <br>
            </h1>


            <a class="start-button" href="/editor.html">
                사용하기
                <span aria-hidden="true">→</span>
            </a>
        </section>

        <section class="features" aria-label="사용 방법">
            <article class="feature">
                <span class="number">01</span>
                <h2>내용 작성</h2>
                <p>
                    별도의 프로그램 설치 없이
                    브라우저에서 문서를 작성하세요
                </p>
            </article>

            <article class="feature">
                <span class="number">02</span>
                <h2>서식 편집</h2>
                <p>
                    내용을 보기 좋게 편집하세요
                </p>
            </article>

            <article class="feature">
                <span class="number">03</span>
                <h2>파일 다운로드</h2>
                <p>
                    제공하는 파일 형식을 선택해
                    완성한 문서를 다운로드하세요
                </p>
            </article>
        </section>
    </main>

    <footer>
        <p>작업실 · 웹 문서 에디터</p>
        <p>현재 개발 중이며 기능이 업데이트됩니다</p>
        <p>원하는 기능은 문의주세요</p>
    </footer>
</div>
</body>
</html>
