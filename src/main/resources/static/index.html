<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Docx Editor</title>
    <link rel="stylesheet" href ="index.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="toolbar">

    <input type="text" id="doc-title" placeholder="제목을 입력하세요..."/>
    <p>|</p>
    <select id="font-size">
        <option value="11px">8</option>
        <option value="12px">9</option>
        <option value="13px">10</option>
        <option value="14px" selected>11 (기본값)</option>
        <option value="16px">12</option>
        <option value="18px">14</option>
        <option value="21px">16</option>
        <option value="24px">18</option>
        <option value="26px">20</option>
        <option value="29px">22</option>
        <option value="32px">24</option>
        <option value="34px">26</option>
        <option value="37px">28</option>
        <option value="48px">36</option>
        <option value="64px">48</option>
        <option value="90px">72</option>
    </select>
    <p>|</p>

    <button id="bold">강조</button>
    <button id="underline">밑줄</button>
    <button id="italic">기울이기</button>

    <p>|</p>

    <button id="align-left">왼쪽</button>
    <button id="align-center">가운데</button>
    <button id="align-right">오른쪽</button>
    <p>|</p>
    <button id="dark-mode">다크</button>
    <p>|</p>
    <button id="white-mode">화이트</button>

</div>

<div id="editor"></div>
<button id="docx-download">DOCX 다운로드</button>
<button id="hwp-download">HWP 다운로드</button>
<script type = "module" src="index.js"></script>
</body>
</html>
