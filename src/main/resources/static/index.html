<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업실 — 웹 문서 에디터</title>
    <meta name="description"
          content="브라우저에서 문서를 작성하고 원하는 파일 형식으로 다운로드하세요.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #252525;
            background: #faf9f6;
            word-break: keep-all;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1040px, 100% - 40px);
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 88px;
            border-bottom: 1px solid #e8e5df;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .github {
            font-size: 14px;
            color: #666;
        }

        .github:hover {
            color: #252525;
        }

        .hero {
            padding: 100px 0 72px;
        }

        .eyebrow {
            margin: 0 0 20px;
            color: #74716a;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 6vw, 64px);
            line-height: 1.2;
            letter-spacing: -2px;
        }


        .start-button {
            display: inline-flex;
            align-items: center;
            gap: 24px;
            padding: 16px 24px;
            border-radius: 10px;
            background: #303c31;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }

        .start-button:hover {
            background: #435344;
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 3px solid #79977c;
            outline-offset: 5px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-bottom: 80px;
        }

        .feature {
            padding: 28px;
            border: 1px solid #e8e5df;
            border-radius: 14px;
            background: #fff;
        }

        .number {
            color: #8b9487;
            font-size: 13px;
            font-weight: 700;
        }

        .feature h2 {
            margin: 24px 0 12px;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .feature p {
            margin: 0;
            color: #77736c;
            font-size: 15px;
            line-height: 1.8;
        }

        footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 0;
            border-top: 1px solid #e8e5df;
            color: #88847d;
            font-size: 13px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 640px) {
            header {
                min-height: 72px;
            }

            .hero {
                padding: 64px 0 48px;
            }


            .features {
                grid-template-columns: 1fr;
                padding-bottom: 48px;
            }

            footer {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <a class="logo" href="/">작업실</a>

        <a class="github"
           href="https://github.com/EEES0/docx-editor"
           target="_blank"
           rel="noopener noreferrer">
            GitHub ↗
        </a>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <p class="eyebrow">WORKING SPACE</p>

            <h1 id="hero-title">
                내가 쓰려고 만든<br>
                문서 작업실<br>
                <br>
            </h1>


            <a class="start-button" href="/editor.html">
                사용하기
                <span aria-hidden="true">→</span>
            </a>
        </section>

        <section class="features" aria-label="사용 방법">
            <article class="feature">
                <span class="number">01</span>
                <h2>내용 작성</h2>
                <p>
                    별도의 프로그램 설치 없이
                    브라우저에서 문서를 작성하세요
                </p>
            </article>

            <article class="feature">
                <span class="number">02</span>
                <h2>서식 편집</h2>
                <p>
                    내용을 보기 좋게 편집하세요
                </p>
            </article>

            <article class="feature">
                <span class="number">03</span>
                <h2>파일 다운로드</h2>
                <p>
                    제공하는 파일 형식을 선택해
                    완성한 문서를 다운로드하세요
                </p>
            </article>
        </section>
    </main>

    <footer>
        <p>작업실 · 웹 문서 에디터</p>
        <p>현재 개발 중이며 기능이 업데이트됩니다</p>
        <p>원하는 기능은 문의주세요</p>
    </footer>
</div>
</body>
</html>
