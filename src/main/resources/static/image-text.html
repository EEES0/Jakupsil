<main id="document-workspace" tabindex="-1">
    <p class="document-type">이미지 작업 · 텍스트 추출</p>
    <h1>이미지 텍스트 추출 (베타)</h1>
    <p class="converter-description">사진 속 한국어와 영어를 텍스트로 추출합니다. 수식이나 표 형태는 인식이 어렵습니다.</p>
    <form id="convert-form">
        <div class="upload-field">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>
            <label for="text-image">이미지 선택</label>
            <p id="file-help">JPG·PNG 한 장</p>
            <input id="text-image" name="image" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" aria-describedby="file-help selected-file" required>
            <p id="selected-file" role="status">선택된 파일이 없습니다.</p>
        </div>
        <div class="conversion-actions">
            <button id="convert-button" type="submit" disabled aria-describedby="convert-status">텍스트 추출</button>

        </div>
    </form>
    <p id="convert-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section id="text-result-section" class="text-result" hidden>
        <div class="text-result-heading"><label for="extracted-text">추출 결과</label><button id="copy-text" type="button" disabled>텍스트 복사</button></div>
        <textarea id="extracted-text" readonly rows="14" spellcheck="false" aria-describedby="convert-status"></textarea>
    </section>
    <noscript><p>파일 변환을 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
</main>
</body>
