name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Run tests
        run: ./gradlew test

      - name: set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      - name: execute permission for gradlew
        run: chmod +x gradlew

      - name: run tests
        run: ./gradlew test

      - name: Check Python environment
        run: |
          pwd
          which python
          python --version
          python -m pip list
          ls -la python/

      - name: Print failed test details
        if: failure()
        run: |
          find build/test-results/test -name "*.xml" \
            -exec grep -A 35 -B 5 "<failure" {} \;

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/